name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3 # Actualizado a v3
        with:
          version: 9 # Versión corregida

      - name: 📂 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 💾 Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Si no subiste el pnpm-lock.yaml, sacale el --frozen-lockfile por ahora
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Generate Prisma Client
        run: pnpm prisma generate

      - name: 🔍 Run linter
        run: pnpm lint
        continue-on-error: true

      - name: 🔨 Build project
        run: pnpm build
        env:
          CI: true
          # Si tu build requiere variables de entorno obligatorias para Prisma, agregalas acá.
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}
