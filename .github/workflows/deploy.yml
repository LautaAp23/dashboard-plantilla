name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.21.0

      - name: 📂 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 💾 Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build project
        run: pnpm build
        env:
          CI: true

      - name: 🚀 Deploy to Vercel (configura según tu setup)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "✅ Build completado y listo para desplegar"
          echo "📝 Configura tu deploy según tu plataforma (Vercel, AWS, etc.)"
          echo "🔐 Agrega VERCEL_TOKEN en Settings > Secrets and variables > Actions"

      - name: 📧 Notify deployment
        if: success()
        run: echo "✅ Deployment completado exitosamente"
